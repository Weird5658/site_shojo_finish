<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="main-nav">
      <a href="#" class="nav-item active">ANIME</a>
      <a href="manga.html" class="nav-item">MANGA</a>
    </nav>

    <div class="search-bar">
      <input type="text" placeholder="Rechercher un anime...">
    </div>

    <div class="logo-right">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Anime_logo.png" alt="Logo anime">
    </div>
  </header>

  <main class="content">
    <div class="cards">
      <div class="card" id="card-1">
        <div class="image-container">
          <img src="https://upload.wikimedia.org/wikipedia/en/6/6c/Ao_Haru_Ride_visual.jpg" alt="Ao Haru Ride">
          <div class="desc-box">description</div>
        </div>
      </div>
      <div class="card" id="card-2">
        <div class="image-container">
          <img src="https://upload.wikimedia.org/wikipedia/en/e/ee/A_Silent_Voice_%28movie%29_poster.jpg" alt="A Silent Voice">
          <div class="desc-box">description</div>
        </div>
      </div>
      <div class="card" id="card-3">
        <div class="image-container">
          <img src="https://upload.wikimedia.org/wikipedia/en/7/7c/Orange_poster.jpg" alt="Orange">
          <div class="desc-box">description</div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
